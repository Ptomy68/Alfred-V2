<style>
  :root{
    --paper:#EFE8F4;
    --surface:#FFFFFF;
    --ink:#2E1B3D;
    --raspberry:#E0577A;
    --gold:#C9982F;
    --teal:#3E7C89;
    --violet:#7A4FB5;
    --sky:#3B6FA0;
    --success:#3F8361;
    --error:#B33A3A;
    --muted:#6E5F78;
    --r-lg:22px;
    --r-md:14px;
    --r-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  .hero{background:linear-gradient(135deg,#3B2350,#C9527A);border-radius:var(--r-lg);padding:24px 22px;color:#F8F0F4;}
  .hero h1{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.9rem;margin:0 0 5px;line-height:1.1;}
  .hero .sub{font-size:0.88rem;opacity:0.85;}
  .hero-stats{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .hero-chip{background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.28);border-radius:20px;padding:6px 12px;font-size:0.76rem;font-weight:700;}

  .maintabs{display:flex;gap:8px;margin:18px 0 16px;}
  .maintab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid rgba(46,27,61,0.16);background:var(--surface);color:var(--ink);padding:10px 6px;border-radius:var(--r-md);font-weight:700;font-size:0.76rem;cursor:pointer;}
  .maintab svg{width:19px;height:19px;}
  .maintab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .card{background:var(--surface);border:1px solid rgba(46,27,61,0.12);border-radius:var(--r-lg);padding:22px;}
  .card h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.45rem;margin:0 0 6px;color:var(--ink);}
  .card .sub{color:var(--muted);font-size:0.88rem;line-height:1.5;margin-bottom:16px;}
  .back-btn{background:none;border:none;color:var(--muted);font-size:0.85rem;cursor:pointer;padding:0 0 14px;text-decoration:underline;display:block;}

  /* Cours */
  .priority-badge{display:inline-block;background:rgba(179,58,58,0.12);color:var(--error);font-size:0.72rem;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:10px;}
  .lesson-list{display:flex;flex-direction:column;gap:10px;}
  .lesson-btn{text-align:left;padding:14px 16px;border:1.5px solid rgba(46,27,61,0.16);border-radius:var(--r-md);background:transparent;font-weight:700;font-size:0.95rem;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .lesson-btn .cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .lesson-btn .mastered-tag{font-size:0.68rem;color:var(--success);font-weight:700;}
  .lesson-body{font-size:0.93rem;line-height:1.6;}
  .lesson-body h3{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.1rem;margin:16px 0 6px;}
  .lesson-body ul{padding-left:20px;margin:8px 0;}
  .lesson-body li{margin-bottom:6px;}
  .lesson-body .ex{color:var(--muted);font-style:italic;}
  .mastered-toggle{background:none;border:none;color:var(--muted);font-size:0.82rem;text-decoration:underline;cursor:pointer;padding:12px 0 0;display:block;}

  /* Mode select */
  .mode-row{display:flex;align-items:flex-start;gap:14px;padding:15px 2px;border-bottom:1px solid rgba(46,27,61,0.1);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-family:'Manrope',sans-serif;}
  .mode-row:last-child{border-bottom:none;}
  .mode-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mode-icon svg{width:20px;height:20px;}
  .mode-info h3{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.05rem;margin:0 0 3px;color:var(--ink);}
  .mode-info p{font-size:0.83rem;color:var(--muted);margin:0;line-height:1.4;}

  /* QCM */
  .start-box{text-align:center;padding:16px 0;}
  .start-btn{background:var(--ink);color:var(--paper);border:none;padding:13px 26px;border-radius:24px;font-weight:700;font-size:0.95rem;cursor:pointer;}
  .qcount{font-size:0.78rem;color:var(--muted);margin-bottom:6px;}
  .prompt{font-size:1.03rem;line-height:1.5;margin-bottom:16px;}
  .prompt em{font-style:normal;border-bottom:2px solid var(--gold);padding:0 2px;}
  .options{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
  .opt{text-align:left;padding:11px 14px;border:1.5px solid rgba(46,27,61,0.2);border-radius:var(--r-sm);background:transparent;font-family:'Manrope',sans-serif;font-size:0.94rem;color:var(--ink);cursor:pointer;}
  .opt.correct{border-color:var(--success);background:rgba(63,131,97,0.09);}
  .opt.incorrect{border-color:var(--error);background:rgba(179,58,58,0.09);}
  .opt:disabled{cursor:default;}
  .unknown-btn{background:none;border:1px dashed var(--muted);color:var(--muted);font-size:0.8rem;padding:6px 10px;border-radius:8px;cursor:pointer;margin-bottom:14px;}
  .unknown-btn.flagged{border-color:var(--gold);color:#8a6a1f;}
  .unknown-reveal{font-size:0.85rem;background:rgba(201,152,47,0.13);border-radius:8px;padding:8px 10px;margin-bottom:14px;display:none;}
  .unknown-reveal.show{display:block;}
  .feedback{display:none;padding:12px 14px;border-radius:var(--r-sm);font-size:0.9rem;line-height:1.45;margin-bottom:14px;}
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(63,131,97,0.1);color:var(--success);}
  .feedback.ko{background:rgba(179,58,58,0.1);color:var(--error);}
  .feedback b{display:block;font-family:'Instrument Serif',serif;font-style:italic;font-size:1rem;margin-bottom:3px;}
  .actions{display:flex;justify-content:space-between;align-items:center;}
  .next-btn{background:var(--ink);color:var(--paper);border:none;padding:10px 18px;border-radius:20px;font-weight:700;font-size:0.88rem;cursor:pointer;display:none;}
  .next-btn.show{display:inline-block;}
  .score-pill{font-size:0.82rem;color:var(--muted);font-variant-numeric:tabular-nums;}

/* ---------- Local storage: IndexedDB primary, localStorage safety net ----------
   No dependency on Claude, window.storage, or any network connection. */
const IDB_NAME = 'coach_anglais_db';
const IDB_VERSION = 1;
const IDB_STORE = 'kv';
function openIDB(){
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeGet(key){
  try{
    const db = await openIDB();
    const val = await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (val !== undefined && val !== null) return val;
  }catch(e){ console.warn('IndexedDB read failed, trying localStorage', e); }
  try{
    const raw = localStorage.getItem('lsfallback_' + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e2){ return null; }
}
async function storeSet(key, value){
  let ok = false;
  try{
    const db = await openIDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    ok = true;
  }catch(e){ console.warn('IndexedDB write failed, falling back to localStorage', e); }
  try{
    localStorage.setItem('lsfallback_' + key, JSON.stringify(value));
    ok = true;
  }catch(e2){ /* both failed; ok stays as IndexedDB result */ }
  return ok;
}
async function storeDelete(key){
  try{ const db = await openIDB(); const tx = db.transaction(IDB_STORE, 'readwrite'); tx.objectStore(IDB_STORE).delete(key); }catch(e){}
  try{ localStorage.removeItem('lsfallback_' + key); }catch(e2){}
}

const lessons = [
  {id:'phrasal', tag:'Leçon', title:'Les verbes à particule (phrasal verbs)', body: `
    <p>Un verbe à particule est un verbe suivi d'une préposition ou d'un adverbe dont le sens global n'est souvent pas déductible des deux mots pris séparément.</p>

    <p>Devant un nom déjà mentionné, unique, ou spécifique pour les deux interlocuteurs. Aussi pour les instruments de musique qu'on pratique.</p>
    <p class="ex">He plays the guitar. (règle fixe à connaître par cœur)</p>
    <h3>∅ (pas d'article)</h3>
    <p>Devant un nom indénombrable au sens général, ou un pluriel générique.</p>
    <p class="ex">Employees need flexibility. Cats are independent animals.</p>
  `},
  {id:'modals', tag:'Leçon', title:'Les modaux : sens et construction', body: `
    <h3>Le sens des modaux</h3>
    <ul>
      <li><b>must</b> — obligation forte / quasi-certitude : "You must wear a seatbelt."</li>
      <li><b>have to</b> — obligation qui vient de l'extérieur : "I have to work on Saturday."</li>
      <li><b>should</b> — conseil : "You should see a doctor."</li>
      <li><b>can / could</b> — capacité, permission, possibilité : "Can I open the window?"</li>
      <li><b>may / might</b> — possibilité incertaine : "It might rain later."</li>
      <li><b>need to</b> — nécessité concrète : "I need to buy some milk."</li>
    </ul>
    <h3>La construction</h3>
    <p>Après un modal, le verbe est <b>toujours à sa forme de base</b>, sans "to", sans "-s", et surtout <b>sans "be"</b> — sauf vrai passif.</p>
    <p class="ex">This method could improve the results. (pas "could be improve")</p>
    <h3>Modal + be able to + verbe</h3>
    <p class="ex">Employees should be able to choose their hours. (pas "should be choose")</p>
    <h3>Modal + be + participe passé (le vrai passif)</h3>
    <p class="ex">The rules must be followed. The project can be finished next week.</p>
  `},
  {id:'tenses', tag:'Leçon', title:'Les temps verbaux : bien choisir son temps', body: `
    <p>C'est souvent le point le plus difficile pour les francophones, car le present perfect n'a pas d'équivalent direct en français.</p>
    <h3>Present simple vs present continuous</h3>
    <p class="ex">I work every day. (habitude) / Look, it's raining! (maintenant) / We're meeting them tomorrow. (déjà prévu)</p>
    <h3>Past simple vs present perfect</h3>
    <p>Past simple = moment précis et daté. Present perfect = pas de date, ou lien avec le présent (résultat, expérience, "since/for").</p>
    <p class="ex">I saw that movie last year. / I have seen that movie. / She has lived here since 2019.</p>
    <h3>going to vs will</h3>
    <p>"going to" = prédiction avec preuve visible, ou projet déjà décidé. "will" = décision spontanée, promesse.</p>
    <p class="ex">Look at those clouds, it's going to rain. / I'll call you back.</p>
    <h3>Astuce générale</h3>
    <p class="ex">Date précise ("yesterday", "in 2020") → past simple. "since/for/already/just/ever/never" → present perfect.</p>
  `},
  {id:'irregular', tag:'Leçon', title:'Les verbes irréguliers : les pièges classiques', body: `
    <p>Trois familles : formes identiques (put-put-put), passé = participe (buy-bought-bought), trois formes différentes (go-went-gone).</p>
    <h3>L'erreur la plus fréquente</h3>
    <p>Vouloir les régulariser en "-ed" : "goed", "doed", "seed" n'existent pas.</p>
    <p class="ex">She has gone home. (pas "has went") / He has done his homework. (pas "has did")</p>
    <h3>Deux pièges à isoler</h3>
    <p><b>lie / lay</b> — "lie" (s'allonger, intransitif) : lie-lay-lain. "lay" (poser qqch, transitif) : lay-laid-laid.</p>
    <p class="ex">I lie down when I'm tired. → Yesterday I lay down early.</p>
    <p><b>rise / raise</b> — "rise" (s'élever, intransitif) : rise-rose-risen. "raise" (élever qqch, transitif) : régulier.</p>
    <p class="ex">Prices rise every year. / The teacher raises her hand.</p>
    <p>Liste complète dans l'onglet <b>Vocabulaire</b>.</p>
  `},
  {id:'agreement', tag:'Leçon', title:'Accords sujet-verbe et adjectifs composés', body: `
    <p>Sujet pluriel → verbe sans "-s". Sujet singulier → verbe en "-s" au présent simple.</p>
    <p class="ex">The employees have three meetings. / The policy affects everyone.</p>
    <h3>Piège : everyone, everybody, someone...</h3>
    <p class="ex">Everyone has to bring their own lunch.</p>
    <h3>Adjectifs composés</h3>
    <p>Nombre + nom + tirets → le nom reste au singulier.</p>
    <p class="ex">a 2-hour flight — a 30-year-old woman — a 35-hour work week</p>
  `},
  {id:'falsefriends', tag:'Leçon', title:'Les faux-amis franco-anglais', body: `
    <ul>
      <li><b>consumption</b> = consommation — orthographe différente du français.</li>
      <li><b>beneficial</b> = bénéfique — "benefic" n'existe pas.</li>
      <li><b>the economy</b> (système) vs <b>economics</b> (discipline universitaire).</li>
      <li><b>sensible</b> = raisonnable — PAS "sensible" au sens émotif (= "sensitive").</li>
      <li><b>actually</b> = en fait — PAS "actuellement" (= "currently").</li>
      <li><b>found</b> (passé de "find") vs <b>founded</b> (fondé, créé).</li>
    </ul>
    <p>Réflexe : un mot "trop facile" à traduire depuis le français cache souvent un faux-ami.</p>
  `}
];

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- CEFR skill levels ---------- */
const CEFR_SCALE = ['A1-','A1','A1+','A2-','A2','A2+','B1-','B1','B1+','B2-','B2','B2+','C1-','C1','C1+'];
const SKILL_NAMES = {grammar:'Grammaire & vocabulaire', reading:'Compréhension écrite', writing:'Expression écrite', listening:'Compréhension orale'};
function cefrLabel(idx){ return CEFR_SCALE[Math.max(0, Math.min(CEFR_SCALE.length-1, idx))]; }
function adjustLevel(skillKey, scorePercent){
  const cur = state.skillLevels[skillKey];
  let next = cur;
  if (scorePercent >= 80) next = Math.min(CEFR_SCALE.length-1, cur+1);
  else if (scorePercent < 40) next = Math.max(0, cur-1);
  state.skillLevels[skillKey] = next;
  return { before: cur, after: next, direction: next > cur ? 'up' : (next < cur ? 'down' : 'same') };
}
function levelNoteHTML(skillKey, adjustment){
  const dir = adjustment.direction;
  const cls = dir === 'up' ? '' : (dir === 'down' ? 'down' : 'same');
  const msg = dir === 'up'
    ? `Niveau ${SKILL_NAMES[skillKey]} : ${cefrLabel(adjustment.before)} → <b>${cefrLabel(adjustment.after)}</b> — bien joué, la difficulté monte un peu.`
    : dir === 'down'
    ? `Niveau ${SKILL_NAMES[skillKey]} : ${cefrLabel(adjustment.before)} → <b>${cefrLabel(adjustment.after)}</b> — on redescend d'un cran, pas de souci.`
    : `Niveau ${SKILL_NAMES[skillKey]} : reste à <b>${cefrLabel(adjustment.after)}</b>.`;
  return `<div class="level-note ${cls}">${msg}</div>`;
}

    _meta: { savedAt: null }
  };
}
let state = defaultState();
function ensureCategoryProgress(){
  CATEGORY_KEYS.forEach(c => {
    if (!state.categoryProgress[c]) state.categoryProgress[c] = {correctStreak:0, wrongRecent:0, mastered:false, needsReview:false};
  });
  if (!state.skillLevels) state.skillLevels = defaultState().skillLevels;
}
function recordCategoryResult(cat, isCorrect){
  if (!CATEGORY_KEYS.includes(cat)) return;
  const cp = state.categoryProgress[cat];
  if (isCorrect){
    cp.correctStreak++;
    cp.wrongRecent = 0;
    if (cp.correctStreak >= MASTER_STREAK){ cp.mastered = true; cp.needsReview = false; }
  } else {
    cp.wrongRecent++;
    cp.correctStreak = 0;
    cp.mastered = false;
    if (cp.wrongRecent >= REVIEW_THRESHOLD){ cp.needsReview = true; }
  }
}
async function persist(){
  state._meta = { savedAt: new Date().toISOString() };
  await storeSet('coach_state_v1', state);
}

/* ---------- Sauvegarde (export / import / restore / erase) ---------- */
const BACKUP_VERSION = 1;
function wrapBackup(data){ return { version: BACKUP_VERSION, createdAt: new Date().toISOString(), data }; }
function validBackupShape(obj){ return !!(obj && typeof obj.version === 'number' && obj.data && typeof obj.data === 'object'); }
async function snapshotPreviousBackup(){
  await storeSet('coach_backup_prev', wrapBackup(state));
}
function flashButton(btn, text, revertAfter){
  const original = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = original; }, revertAfter || 1800);
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function applyImportedState(loaded, btn){
  await snapshotPreviousBackup();
  state = { ...defaultState(), ...loaded };
  ensureCategoryProgress();
  await persist();
  refreshHeroStats();
  if (activeTab === 'save') renderSauvegardeTab();
  flashButton(btn, '✓ Chargé');
}
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  const btn = document.getElementById('btnImport');
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (evt) => {
    let parsed;
    try{ parsed = JSON.parse(evt.target.result); }
    catch(err){ flashButton(btn, 'Fichier invalide — rien n\'a été modifié', 2600); e.target.value=''; return; }
    if (!validBackupShape(parsed)){ flashButton(btn, 'Format non reconnu — rien n\'a été modifié', 2600); e.target.value=''; return; }
    const ok = confirm('Ceci va remplacer tes données actuelles (cours, vocabulaire, niveaux) par celles de ce fichier, daté du ' + new Date(parsed.createdAt).toLocaleString('fr-FR') + '.\n\nTon état actuel sera gardé en secours et récupérable via "Restaurer la dernière sauvegarde locale".\n\nContinuer ?');
    if (!ok){ e.target.value=''; return; }
    await applyImportedState(parsed.data, btn);
    e.target.value = '';
  };
  reader.readAsText(file);
});

async function callClaudeJSON(promptText){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: promptText }] })
  });
  if (!response.ok) throw new Error("API error " + response.status);
  const data = await response.json();
  const text = data.content.map(b => b.type === 'text' ? b.text : '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

let quiz = null;
async function generateAIQuestions(n){
  const priorityCats = CATEGORY_KEYS.filter(c => state.categoryProgress[c].needsReview);
  const avoidTerms = state.masteredTerms.slice(-15);
  const level = cefrLabel(state.skillLevels.grammar);
  const instruction = `Tu es un générateur d'exercices d'anglais pour un(e) apprenant(e) francophone. Calibre précisément la difficulté (vocabulaire, complexité grammaticale, longueur des phrases) pour un niveau CECRL ${level} (plus simple pour A1/A2, plus subtil pour B2/C1).
Crée exactement ${n} questions variées, en mélangeant deux formats à peu près à parts égales :
- "type":"mcq" (QCM) avec "options" (3 ou 4 courtes) et "answerIndex" (index de la bonne réponse)
- "type":"cloze" (texte à trous, réponse tapée au clavier) avec "acceptableAnswers" (1 à 3 réponses acceptées, formes courtes)
Catégorie pour chaque question, choisis UNE valeur exacte parmi : "tenses","modals","irregular","phrasal","falsefriends","articles","agreement". Varie les catégories.
${priorityCats.length > 0 ? `Priorise si possible ces catégories que l'apprenant maîtrise moins bien : ${priorityCats.join(', ')}.` : ''}
${avoidTerms.length > 0 ? `Évite de retester ces éléments déjà maîtrisés : ${avoidTerms.join(', ')}.` : ''}
Utilise des thèmes quotidiens variés (voyage, environnement, technologie, santé, loisirs, vie professionnelle), différents à chaque question.
Chaque question a une explication en français d'au maximum 20 mots.
Réponds UNIQUEMENT avec un tableau JSON valide, sans texte autour, sans markdown, exactement dans ce format :
[{"type":"mcq","category":"tenses","prompt":"phrase avec ___ pour le trou","options":["...","...","...","..."],"answerIndex":0,"explain":"explication courte en français","focusTerm":"mot ou structure testée","focusTranslation":"traduction très courte"},{"type":"cloze","category":"phrasal","prompt":"phrase avec ___ pour le trou","acceptableAnswers":["give up"],"explain":"explication courte","focusTerm":"give up","focusTranslation":"traduction courte"}]`;
  const parsed = await callClaudeJSON(instruction);
  if (!Array.isArray(parsed) || parsed.length === 0) throw new Error("bad shape");
  const mapped = parsed.filter(q => {
    if (!q || !q.prompt) return false;
    if (q.type === 'cloze') return Array.isArray(q.acceptableAnswers) && q.acceptableAnswers.length > 0;
    return Array.isArray(q.options) && q.options.length >= 2 && typeof q.answerIndex === 'number' && q.answerIndex >= 0 && q.answerIndex < q.options.length;
  }).map(q => {
    const base = { type: q.type === 'cloze' ? 'cloze' : 'mcq', cat: catNames[q.category] ? q.category : 'mixed', prompt: q.prompt, explain: q.explain || '', word: { term: q.focusTerm || '', translation: q.focusTranslation || '', example: '' } };
    return base.type === 'cloze' ? { ...base, acceptableAnswers: q.acceptableAnswers } : { ...base, options: q.options, answer: q.answerIndex };
  });
  if (mapped.length < Math.min(4, n)) throw new Error("too few valid questions");
  return mapped;
}
async function startQuiz(){
  renderLoading("Génération d'un nouveau lot d'exercices");
  let pool;
  try{
    pool = await generateAIQuestions(6);
  }catch(e){
    let available = staticQuestions.filter(q => !state.masteredQuestionIds.includes(q.id));
    if (available.length < 8) available = staticQuestions;
    pool = shuffle(available).slice(0, 10);
  }
  pool = pool.map(q => {
    if ((q.type || 'mcq') === 'mcq'){
      const optIdx = shuffle(q.options.map((_, i) => i));
      return { ...q, shuffledOptions: optIdx.map(i => q.options[i]), shuffledAnswer: optIdx.indexOf(q.answer) };
    }
    return q;
  });
  quiz = { pool, index: 0, catScores: {}, sessionFlagged: [] };
  Object.keys(catNames).forEach(c => quiz.catScores[c] = { correct: 0, total: 0 });
  renderQuestion();
}
function renderQuestion(){
  if (quiz.index >= quiz.pool.length){ renderQuizEnd(); return; }
  const q = quiz.pool[quiz.index];
  const type = q.type || 'mcq';
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="qcount">Question ${quiz.index+1}/${quiz.pool.length} — ${catNames[q.cat] || 'Général'}${type === 'cloze' ? ' · texte à trous' : ''}</div>
    <div class="prompt">${q.prompt}</div>
    ${type === 'mcq' ? '<div class="options" id="options"></div>' : `
      <div class="cloze-row">
        <input type="text" id="clozeInput" placeholder="Ta réponse..." autocomplete="off" autocapitalize="off">
        <button id="clozeSubmit">Valider</button>
      </div>
    `}
    <button class="unknown-btn" id="unknownBtn">Je ne connais pas ce mot / cette expression</button>
    <div class="unknown-reveal" id="unknownReveal"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <span class="score-pill">Score : ${totalCorrect()}/${totalAnswered()}</span>
      <button class="next-btn" id="nextBtn">Suivant →</button>
    </div>
  `;
  if (type === 'mcq'){
    const optionsEl = document.getElementById('options');
    q.shuffledOptions.forEach((opt, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = opt;
      b.onclick = () => selectAnswer(i);
      optionsEl.appendChild(b);
    });
  } else {
    document.getElementById('clozeSubmit').onclick = submitCloze;
    document.getElementById('clozeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCloze(); });
  }
  document.getElementById('unknownBtn').onclick = () => flagUnknown(q);
}
async function flagUnknown(q){
  const v = getWord(q);
  if (!v || !v.term) return;
  const btn = document.getElementById('unknownBtn');
  btn.classList.add('flagged');
  btn.textContent = 'Ajouté à ton carnet de vocabulaire';
  const reveal = document.getElementById('unknownReveal');
  reveal.classList.add('show');
  reveal.innerHTML = `<b>${v.term}</b> — ${v.translation}${v.example ? '<br><span style="opacity:0.75;">' + v.example + '</span>' : ''}`;
  if (!quiz.sessionFlagged.find(x => x.term === v.term)) quiz.sessionFlagged.push(v);
  // Commit + save immediately so a word is never lost even if the session isn't finished
  if (!state.unknownWords.find(x => x.term === v.term)){
    state.unknownWords.push(v);
    await persist();
    refreshHeroStats();
  }
}
function finishAnswer(q, isCorrect){
  const cat = catNames[q.cat] ? q.cat : 'mixed';
  quiz.catScores[cat].total++;
  if (isCorrect) quiz.catScores[cat].correct++;

  recordCategoryResult(cat, isCorrect);
  if (isCorrect){
    if (q.id) { if (!state.masteredQuestionIds.includes(q.id)) state.masteredQuestionIds.push(q.id); }
    const w = getWord(q);
    if (w && w.term && !state.masteredTerms.includes(w.term)) state.masteredTerms.push(w.term);
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'ko');
  fb.innerHTML = `<b>${isCorrect ? 'Correct' : 'À revoir'}</b>${q.explain}`;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.add('show');
  nextBtn.textContent = isCorrect ? 'Suivant →' : "J'ai compris, suivant →";
  nextBtn.onclick = () => { quiz.index++; renderQuestion(); };

  document.querySelector('.score-pill').textContent = `Score : ${totalCorrect()}/${totalAnswered()}`;
}
function selectAnswer(i){
  const q = quiz.pool[quiz.index];
  const opts = document.querySelectorAll('.opt');
  opts.forEach((el, idx) => {
    el.disabled = true;
    if (idx === q.shuffledAnswer) el.classList.add('correct');
    else if (idx === i) el.classList.add('incorrect');
  });
  finishAnswer(q, i === q.shuffledAnswer);
}
function normalizeClozeAnswer(s){
  return s.toLowerCase().trim().replace(/[.,!?;:'"]/g, '').replace(/\s+/g, ' ');
}
function submitCloze(){
  const q = quiz.pool[quiz.index];
  const input = document.getElementById('clozeInput');
  const userVal = normalizeClozeAnswer(input.value);
  const isCorrect = q.acceptableAnswers.some(a => normalizeClozeAnswer(a) === userVal);
  input.disabled = true;
  document.getElementById('clozeSubmit').disabled = true;
  input.style.borderColor = isCorrect ? 'var(--success)' : 'var(--error)';
  finishAnswer(q, isCorrect);
}
function totalCorrect(){ return Object.values(quiz.catScores).reduce((s,v)=>s+v.correct,0); }
function totalAnswered(){ return Object.values(quiz.catScores).reduce((s,v)=>s+v.total,0); }

async function renderQuizEnd(){
  quiz.sessionFlagged.forEach(v => { if (!state.unknownWords.find(x => x.term === v.term)) state.unknownWords.push(v); });
  const scorePercent = Math.round(100 * totalCorrect() / totalAnswered());
  const levelAdjustment = adjustLevel('grammar', scorePercent);
  await persist();
  refreshHeroStats();

  const card = document.getElementById('card');
  const cells = Object.keys(catNames).filter(c => quiz.catScores[c].total > 0).map(c => {
    const s = quiz.catScores[c];
    return `<div class="summary-cell"><div class="n">${s.correct}/${s.total}</div><div class="l">${catNames[c]}</div></div>`;
  }).join('');

  card.innerHTML = `
    <div class="stamp"><div class="seal">${scorePercent}%</div></div>
    <div class="summary-grid">${cells}</div>
    ${levelNoteHTML('grammar', levelAdjustment)}
    ${quiz.sessionFlagged.length > 0 ? `
      <h2 style="margin-top:20px;">Avant de terminer : révise ces mots</h2>
      <div class="sub">Appuie sur chacun pour voir la traduction, jusqu'à tous les avoir révisés.</div>
      <div id="flashList"></div>
      <button class="finish-btn" id="finishBtn" disabled>Terminer (révise d'abord tous les mots ci-dessus)</button>
    ` : `<button class="finish-btn" id="finishBtn">Terminer</button>`}
  `;
  if (quiz.sessionFlagged.length > 0){
    const flashList = document.getElementById('flashList');
    let revealedCount = 0;
    quiz.sessionFlagged.forEach(v => {
      const div = document.createElement('div');
      div.className = 'flash';
      div.innerHTML = `<div class="term">${v.term}</div><div class="translation">${v.translation}${v.example ? '<br><span style="font-style:italic;">' + v.example + '</span>' : ''}</div>`;
      div.onclick = () => {
        if (!div.classList.contains('revealed')){
          div.classList.add('revealed');
          revealedCount++;
          if (revealedCount === quiz.sessionFlagged.length){
            document.getElementById('finishBtn').disabled = false;
            document.getElementById('finishBtn').textContent = 'Terminer';
          }
        }

/* ---------- Voice selection for listening (on-device voices, no paid API) ---------- */
function loadVoices(){
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) { resolve([]); return; }
    let voices = window.speechSynthesis.getVoices();
    if (voices && voices.length > 0){ resolve(voices); return; }
    let resolved = false;
    window.speechSynthesis.onvoiceschanged = () => {
      if (resolved) return;
      resolved = true;
      resolve(window.speechSynthesis.getVoices());
    };
    setTimeout(() => { if (!resolved){ resolved = true; resolve(window.speechSynthesis.getVoices() || []); } }, 1200);
  });
}
function englishVoices(voices){ return (voices || []).filter(v => v.lang && v.lang.toLowerCase().startsWith('en')); }
function groupVoicesForSelect(voices){
  const groups = { uk: [], us: [], other: [] };
  voices.forEach(v => {
    const lang = v.lang.toLowerCase();
    if (lang === 'en-gb') groups.uk.push(v);
    else if (lang === 'en-us') groups.us.push(v);
    else groups.other.push(v);
  });
  return groups;
}
function renderVoicePicker(voices){
  const zone = document.getElementById('voicePickerZone');
  if (!zone) return;
  if (voices.length === 0){
    zone.innerHTML = `<p class="sub">Aucune voix anglaise détectée sur cet appareil — la lecture utilisera la voix par défaut du système.</p>`;
    return;
  }
  const groups = groupVoicesForSelect(voices);
  const optHTML = (label, list) => list.length ? `<optgroup label="${label}">${list.map(v => `<option value="${v.name}">${v.name}</option>`).join('')}</optgroup>` : '';
  zone.innerHTML = `
    <div class="qa-block">
      <label>Voix pour les audios</label>
      <div class="cloze-row">
        <select id="voiceSelect">${optHTML('🇬🇧 Anglais britannique', groups.uk)}${optHTML('🇺🇸 Anglais américain', groups.us)}${optHTML('🌐 Autres voix anglaises', groups.other)}</select>
        <button id="previewVoice" type="button">🔊 Tester</button>
      </div>
    </div>
  `;
  const select = document.getElementById('voiceSelect');
  select.style.cssText = "flex:1;border:1.5px solid rgba(46,27,61,0.2);border-radius:var(--r-sm);padding:10px 12px;font-family:'Manrope',sans-serif;font-size:0.92rem;";
  if (state.voicePref && voices.some(v => v.name === state.voicePref)) select.value = state.voicePref;
  else { state.voicePref = select.value; persist(); }
  select.addEventListener('change', async () => { state.voicePref = select.value; await persist(); });
  document.getElementById('previewVoice').onclick = () => {
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance('Hello! This is what this voice sounds like.');
      const chosen = voices.find(v => v.name === select.value);
      if (chosen) u.voice = chosen;
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  };
}

  const sortedVocab = [...visibleVocab].sort((a,b) => (priorityCats.includes(b.cat)?1:0) - (priorityCats.includes(a.cat)?1:0));

  }

  const fullList = document.getElementById('fullList');
  sortedVocab.forEach(v => {
    const div = document.createElement('div');
    div.className = 'vcard' + (priorityCats.includes(v.cat) ? ' priority' : '');
    div.innerHTML = `<div class="t">${v.term}</div><div class="tr">${v.translation}</div><div class="ex">${v.example}</div>`;
    div.onclick = () => div.classList.toggle('open');
    fullList.appendChild(div);
  });

  if (hiddenCount > 0 || masteredCats.includes('irregular')){
    document.getElementById('toggleMasteredVocab').onclick = () => { showMasteredVocab = !showMasteredVocab; renderVocabTab(); };
  }
}

/* ---------- Init ---------- */
async function init(){
  const saved = await storeGet('coach_state_v1');
  if (saved){
    state = { ...defaultState(), ...saved };
  }
  ensureCategoryProgress();
  refreshHeroStats();
  renderCoursList();
}
init();

/* No service worker in this single-file edition — deliberately: iOS Safari's
   Add to Home Screen / standalone display does not require one, and skipping
   it keeps this whole app to exactly one file. See the chat explanation for
   the trade-off (no formal offline network-cache — not needed here since
   every asset is already inline). */
</script>
</body>
